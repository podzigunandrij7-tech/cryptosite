<!doctype html>
<html lang="en">
<head>
    <!-- GLOBAL METADATA -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CryptoLab — Trust Is The New Currency</title>
    <meta name="description" content="Dark theme crypto landing with live crypto prices." />

    <!-- FONTS & EXTERNAL LIBS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- STYLESHEETS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.css" />
    <link rel="stylesheet" href="styles.css" />

    <!-- VENDOR SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.js"></script>
</head>
<body>

    <!-- BLOCK: HEADER -->
    <header class="site-header">
        <div class="container nav">
            <a class="logo" href="#">
                <span class="logo-dot"></span>CryptoLab
            </a>
            
            <button class="burger" id="burger-menu" aria-label="Toggle Menu">
                <span class="burger-icon">☰</span>
            </button>

            <nav class="menu" id="nav-menu">
                <a href="#features">Features</a>
                <a href="#markets">Markets</a>
                <a href="#tools">Tools</a>
                <a href="#about">About</a>
            </nav>

            <div class="actions pc-only">
                <a class="btn ghost" href="#">Login</a>
                <a class="btn primary" href="#">Sign up</a>
            </div>
        </div>
    </header>

    <main>
        <!-- BLOCK: HERO SECTION -->
        <section class="hero" id="home">
            <div class="container hero-inner glass">
                <div class="hero-copy">
                    <h1>Trust Is The <span class="accent">New Currency</span></h1>
                    <p>We build tools for cryptocurrency analytics: charts, live prices, mining calculators and exchange integrations.</p>
                    <div class="cta">
                        <a class="btn primary" href="#">Get Started</a>
                        <a class="btn ghost" href="#">Documentation</a>
                    </div>
                </div>
            </div>
        </section>

        <!-- BLOCK: CRYPTO CARDS (SWIPER) -->
        <section class="cards-section" id="features">
            <div class="container">
                <div class="swiper mySwiper">
                    <div class="swiper-wrapper" id="cards-container">
                        <!-- Dynamically injected via script.js -->
                    </div>
                    <!-- Navigation arrows -->
                    <div class="swiper-button-prev"></div>
                    <div class="swiper-button-next"></div>
                </div>
            </div>
        </section>

        <!-- BLOCK: MARKET CHARTS -->
        <section class="charts" id="markets">
            <div class="container">
                <h2 class="section-title">Market Charts</h2>
                <div class="grid-charts">
                    <!-- BTC Chart -->
                    <div class="chart-item">
                        <iframe src="https://s.tradingview.com/widgetembed/?symbol=BINANCE:BTCUSDT&theme=dark" width="100%" height="400" frameborder="0"></iframe>
                    </div>
                    <!-- ETH Chart -->
                    <div class="chart-item">
                        <iframe src="https://s.tradingview.com/widgetembed/?symbol=BINANCE:ETHUSDT&theme=dark" width="100%" height="400" frameborder="0"></iframe>
                    </div>
                    <!-- BNB Chart -->
                    <div class="chart-item">
                        <iframe src="https://s.tradingview.com/widgetembed/?symbol=BINANCE:BNBUSDT&theme=dark" width="100%" height="400" frameborder="0"></iframe>
                    </div>
                    <!-- SOL Chart -->
                    <div class="chart-item">
                        <iframe src="https://s.tradingview.com/widgetembed/?symbol=BINANCE:SOLUSDT&theme=dark" width="100%" height="400" frameborder="0"></iframe>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- BLOCK: FOOTER -->
    <footer class="site-footer">
        <div class="container">
            <p>&copy; <span id="year"></span> CryptoLab. Data powered by CoinGecko API.</p>
        </div>
    </footer>

    <!-- MAIN LOGIC -->
    <script src="script.js"></script>
</body>
</html>
